name: build

# the Windows program on every push to main, kept for two weeks to try out;
# a tag like v0.2.0 also attaches it to a release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui,dev]" pyinstaller
      # --uac-admin: reading a whole drive needs an administrator, so Windows
      # asks once when the program opens
      - run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin
          --name UnformatUSB
          --add-data "src/usbrescue/gui/qml;usbrescue/gui/qml"
          --add-data "src/usbrescue/gui/i18n;usbrescue/gui/i18n"
          packaging/unformat_usb_main.py

      # Check the packaged program itself, as someone would use it: first on
      # an image file, then on a real (virtual) disk Windows sees as a drive.
      - name: Check the program on a disk image
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/ci_make_test_drive.py "$env:RUNNER_TEMP\drive.img"
          $p = Start-Process dist\UnformatUSB.exe -Wait -PassThru -ArgumentList `
               "--self-test", "$env:RUNNER_TEMP\drive.img", "$env:RUNNER_TEMP\out1", "$env:RUNNER_TEMP\image.json"
          Get-Content "$env:RUNNER_TEMP\image.json"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Check the program on a whole disk
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $vhd = "$env:RUNNER_TEMP\drive.vhd"
          "create vdisk file=`"$vhd`" maximum=80 type=fixed`nattach vdisk" | Out-File -Encoding ascii dp.txt
          diskpart /s dp.txt
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          python tools/ci_make_test_drive.py "$env:RUNNER_TEMP\drive2.img" "\\.\PhysicalDrive$n"
          $p = Start-Process dist\UnformatUSB.exe -Wait -PassThru -ArgumentList `
               "--self-test", "\\.\PhysicalDrive$n", "$env:RUNNER_TEMP\out2", "$env:RUNNER_TEMP\disk.json"
          Get-Content "$env:RUNNER_TEMP\disk.json"
          if ($p.ExitCode -ne 0) { exit 1 }

      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: UnformatUSB-windows
          path: dist/UnformatUSB.exe
          retention-days: 14

      # Signing (SignPath Foundation, free for open source). It turns on by
      # itself once the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID
      # variable exist; until then the program stays unsigned. See docs/code-signing.md.
      - id: can_sign
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "yes=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: sign
        if: steps.can_sign.outputs.yes == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: unformat-usb
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UnformatUSB-windows
          path: signed/UnformatUSB.exe
          overwrite: true
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui,dev]" pyinstaller
      - run: >
          pyinstaller --noconfirm --windowed
          --name UnformatUSB
          --osx-bundle-identifier io.github.aluhxp.unformatusb
          --add-data "src/usbrescue/gui/qml:usbrescue/gui/qml"
          --add-data "src/usbrescue/gui/i18n:usbrescue/gui/i18n"
          packaging/unformat_usb_main.py
      - name: Check the program on a disk image
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/ci_make_test_drive.py "$RUNNER_TEMP/drive.img"
          dist/UnformatUSB.app/Contents/MacOS/UnformatUSB --self-test \
            "$RUNNER_TEMP/drive.img" "$RUNNER_TEMP/out" "$RUNNER_TEMP/image.json" || status=$?
          cat "$RUNNER_TEMP/image.json"
          exit ${status:-0}
      # not signed: the first time, right-click the app and choose Open
      - run: cd dist && ditto -c -k --keepParent UnformatUSB.app UnformatUSB-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UnformatUSB-macos
          path: dist/UnformatUSB-macOS.zip
          retention-days: 14

  # one release with both programs, only once both were built and checked
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          files: |
            dist/UnformatUSB.exe
            dist/UnformatUSB-macOS.zip
