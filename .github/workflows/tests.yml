name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the test images are formatted with the real tools
      - run: sudo apt-get update && sudo apt-get install -y exfatprogs dosfstools libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: pip install pytest PySide6-Essentials
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
