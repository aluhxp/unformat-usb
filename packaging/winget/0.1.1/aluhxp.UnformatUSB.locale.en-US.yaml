ShortDescription: Get back the folders and files of a USB drive or memory card formatted by mistake. Free, no limits, read-only.
Description: |-
  Unformat USB recovers the folders and files of a USB drive or memory card that was quick-formatted by mistake (exFAT and FAT32).
  It reads the drive strictly read-only, rebuilds the old folder tree with its names, shows what it finds while it searches and copies the files to your computer.
  It can first copy the whole drive and work on the copy, brings back loose files named after their content, suggests names for folders that lost theirs, and has a quick option for only photos and videos.
  Free with no limits, works offline, in English, Spanish and Portuguese.
