[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unformat-usb"
version = "0.1.1"
description = "Recover files from a quick-formatted FAT32/exFAT USB drive. Read-only on the source."
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: System :: Recovery Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aluhxp/unformat-usb"

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
unformat-usb-cli = "usbrescue.cli.main:run"

[project.gui-scripts]
unformat-usb = "usbrescue.gui.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"usbrescue.gui" = ["qml/*", "i18n/*.qm", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
